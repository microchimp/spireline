scope:
  primary_track: D      # Defect, A10, Acts 1-3 (D11, D12)
  secondary_track: I    # Ironclad at A10, positions whose cards are all captured (0 UNSUPPORTED)
  ascension: 10         # all ten Ascension modifiers on; no other ascension is reported (D11)
  acts: [1, 2, 3]       # Act-1-first gates are steps on the way, not the scope (D11)
  value_level: L0
  value_units: "L0 points"     # 1 point = 0.01 of u_L0; never reported as pp of P(win)
  llm_components: none         # docs/DECISIONS.md D7, D14: baselines B4/B5, LLM priors, E1 removed
  run_layer_test_corpus: "Spire Codex public export v0.107.1, A10 subset (D13): test only, never trained or tuned on"

seeds:                  # spireline/eval/seeds.py; tests/test_prereg.py checks these hashes
  alphabet: "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ"   # the game's: no I, no O (SeedHelper.cs:12-24)
  length: 10
  derivation: >-
    seed(pool, block, i) = pool + 9 base-34 digits of
    blake2b("spireline-v1:{pool}:{block}:{i}", digest_size=16), little-endian,
    least significant digit first; a seed already in the block is skipped.
  block_hash: 'sha256 over "\n".join(seeds) + "\n", prefixed "sha256:"'
  pools:
    T: {use: "self-play training", blocks: open}
    E:
      use: "promotion and baseline batteries: one fresh block per comparison, never reused"
      block_size: 2000
      n_blocks: 20
      assignment:                 # DRAFT
        E00: "Phase 0 B0/B1 Defect A10 baseline batteries (first discordance and time-per-floor estimates)"
        E01-E19: "one per promotion or pre-registered battery, in order; record each use in LOG.md"
