tier_a:                 # §4.5, §7.1
  track_D: {silver: 1000, dev: 600, test: 400, gold: 200}     # gold is a subset of silver
  track_I: {silver: 400, dev: 250, test: 150}
  mix: {boss: 0.40, elite: 0.30, hallway: 0.30}                # bosses and elites oversampled 2x
  position_sources: [play_agent_self_play, rules_policy, epsilon_perturbed_play, tier_L_live]
  stratify_by: [act, fight_type, turn_index]
  bronze:
    volume: 100000
    continuation: tempo_rollout
    keep_if: "Kendall tau vs silver >= 0.6 on decisive positions"
  silver:
    continuation: "PLAY@60"
    min_fresh_worlds_per_survivor: 100
    target_half_width_L0_points: 1.0
  gold:
    continuation: "PLAY@300"
    target_half_width_L0_points: 0.5
    requires: [stability_vs_B8_continuation, zero_fidelity_flags, ai_particles_not_assumed, referee_spot_check_2pct]

tier_b:                 # Phase 2; listed so the cost-cut rule below has its referent. Act 1 first (a step, D11)
  silver: {n: 300, dev: 180, test: 120, act: 1, method: "V_run + paired deck fights (3 x 8 x 8)"}
  gold: {n: 80, dev: 50, test: 30, act: 1, method: "PLAY-lite act rollouts + AIVAT control variate",
         target_half_width_pp: 2.0}

epsilon:                # §1.4 verdict table
  QUICK_combat:   {quantity: "Q^tempo",    level: L0, epsilon: 1.0, units: "L0 points"}
  DEEP_combat:    {quantity: "Q^PLAY@16",  level: L0, epsilon: 1.0, units: "L0 points"}
  silver_label:   {quantity: "Q^PLAY@60",  level: L0, epsilon: 1.0, units: "L0 points"}
  gold_label:     {quantity: "Q^PLAY@300", level: L0, epsilon: 0.5, units: "L0 points"}
  QUICK_macro:    {quantity: "V_run + paired deck fights", level: L1, epsilon: 2.0, units: "pp P(clear act)"}
  tier_b_gold:    {quantity: "act rollouts", level: L1, epsilon: 2.0, units: "pp P(clear act)"}
  L2:             {quantity: "P(win)", level: L2, epsilon: 1.0, units: "pp P(win)", allowed_when: "pi_ref >= 10% wins and V_run passes Brier skill"}

verdict_rules:          # spireline/api.py classify_verdict
  DECISIVE: "LCB(gap) > 0 and point gap >= epsilon"
  CLOSE: "gap CS inside [-epsilon, +epsilon]"
  UNCERTAIN: "budget exhausted first"
  UNSUPPORTED: "any uncaptured/divergent/unimplemented content, a converter warning, or a one-step fidelity alarm in this fight"

search:                 # §4.1
  candidates: {dfs_cap: 5000, prescore_tempo_rollouts: 4, keep: 16, always_keep: [lethal_lines, end_turn_now]}
  stage1_screening:
    schedule: ["16x32", "8x64", "4x128", "2x256"]     # candidates x CRN worlds
    keep_rule: "up to 6 candidates whose UCB reaches the leader's LCB; minimum 3"
  stage2_estimation: {worlds: "equal and fresh per survivor (cross-fitted)", racing: "paired top-2 difference with a time-uniform CS"}

recall_thresholds:      # §4.1, §7.1
  candidate_recall: {min: 0.98, dev_positions: 200, reference: "64-candidate run"}
  screening_recall: {min: 0.98, dev_positions: 200, reference: "Stage 2 on all 16 candidates",
                     on_fail: "Stage 1 switches to PLAY@16 continuation"}

label_validity:         # §7.1, dev split only
  label_noise_floor_L0_points: {max: 0.3, method: "re-label every position on fresh worlds"}
  budget_x4_stability: {max_argmax_change_among_decisive: 0.05}
  within_family_continuation: ["PLAY@60", "PLAY@300", "PLAY@1500"]
  cross_family_continuation: {reference: B8, positions: 200, on_disagree: "tag continuation_sensitive, exclude from top-1"}
  currency_stability: {compare: [V_run_bot, HP_only_L0, vrun_human], on_disagree: "tag currency_sensitive"}
  currency_sensitive_tag: "potions_held >= 2 or a potion among the candidates"

statistics:
  alpha: 0.05
  ci_method_paired_differences: "empirical-Bernstein CS, Howard et al. 2021 (stitched, eta=2, s=1.4), range [-1, 1]"
  ci_method_unit_interval: "hedged betting CS, Waudby-Smith & Ramdas, predictable plug-in, trunc 1/2"
  coverage_requirement: ">= 0.95 under optional stopping, by simulation (tests/test_confseq_coverage.py)"
  regret_bound: "max(0, max_{b != a_hat} UCB(b) - LCB(a_hat)), Bonferroni across survivors, survivors only"
  cluster_bootstrap_unit: fight
  open_issue: >-
    DRAFT. With the a-priori range [-1, 1], both time-uniform CSs need far more worlds than
    the §4.3 fixed-n estimates (35-246 worlds for h = 1 point at sigma = 3-8 points): measured
    750-850 (betting) and 2,100-3,700 (EB) worlds. Decide before freezing: see LOG.md 2026-10-10.

metrics:                # §7.2
  primary: "mean per-decision regret (L0 points) on Track D Tier-A test, cluster bootstrap by fight"
  secondary:
    - "blunder rate P(regret > epsilon) and P(regret > 5 epsilon), paired exact McNemar"
    - "top-1 on decisive, non-continuation-sensitive positions (CLOSE-set actions count as correct)"
    - "p90 and p99 regret"
  breakdowns: [decision_type, act, encounter]
  target_effect_L0_points: {min: 0.5, max: 1.0}     # never 0.2
  assumed_paired_sigma_L0_points: [3, 5]            # until the week-3 pilot measures it
  mde_at_n400_L0_points: [0.42, 0.70]

baselines: [B0, B1, B2_track_I_only, B3, B7_user, B8]     # B4/B5 (LLM) removed by D7

cost_cut_rule:          # §4.3, pre-registered
  pilot: "week-3 Tier-A pilot, 100 positions: measures sigma, survivors/position, cost, noise floor"
  central_estimates: {silver_core_min: 8, gold_core_min: 45, tier_b_gold_core_h: "1.8-7.2"}
  trigger: "pilot central cost > 2x the estimate"
  action: {tier_a_silver: "1000 -> 600 (Track D)", tier_b_gold: "80 -> 50"}

phase1_gate:            # §8, all relative and pre-registered
  - "label-noise floor < 0.3 L0 points"
  - "budget x4 stability >= 95%"
  - "screening and candidate recall >= 98%"
  - "Gumbel@n regret <= PUCT at matched wall-clock"
  - "F1 passes on Defect A10 tapes (>= 50, 100% match, in every act the tapes reach)"
  - "F5 >= 98% exact on deterministic actions, per act (Acts 1-3)"
  - "P1a `spireline review` shipped by week 5"
